<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelligentSea | The Algorithmic Reef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- RainbowKit & Wagmi Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { createConfig, http, connect, disconnect, watchAccount, getBalance, readContract, writeContract } from 'https://esm.sh/@wagmi/core@2.13.4';
        import { base } from 'https://esm.sh/@wagmi/core/chains';
        import { injected } from 'https://esm.sh/@wagmi/connectors';

        const config = createConfig({
            chains: [base],
            connectors: [injected()],
            transports: {
                [base.id]: http(),
            },
        });

        window.wagmiConfig = config;
        window.wagmiActions = { connect, disconnect, watchAccount, getBalance, readContract, writeContract, injected };
    </script>

    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: #0f172a;
            --reef-glow: #10b981;
            --reef-neon: #34d399;
            --sea-blue: #3b82f6;
            --sea-cyan: #06b6d4;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --border-glow: rgba(16, 185, 129, 0.2);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            overflow-x: hidden;
            line-height: 1.5;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--reef-glow), var(--sea-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        nav a:hover { color: var(--reef-neon); }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--reef-glow);
            color: var(--bg-deep);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            background: var(--reef-neon);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--reef-glow);
        }

        .hero {
            padding: 8rem 2rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-size: 4.5rem;
            margin: 0 0 1.5rem;
            letter-spacing: -0.06em;
            font-weight: 900;
            line-height: 0.9;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .section-header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-left: 4px solid var(--reef-glow);
            padding-left: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 6rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 1.25rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--border-glow);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            background: #1e293b;
            position: relative;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content { padding: 1.5rem; }

        .card-name { font-weight: 800; font-size: 1.1rem; margin-bottom: 0.5rem; }

        .card-utility {
            font-size: 0.85rem;
            color: var(--reef-glow);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .swarm-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 6rem;
        }

        .agent-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
        }

        .price-ticker {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--reef-glow);
            background: rgba(16, 185, 129, 0.1);
            padding: 0.4rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-glow);
            font-weight: 700;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(16, 185, 129, 0.1);
            border-top-color: var(--reef-glow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <canvas class="particles" id="particleCanvas"></canvas>

    <header>
        <div class="logo-container">
            <div class="logo">INTELLIGENTSEA</div>
            <div id="isea-price" class="price-ticker">$ISEA: Loading...</div>
        </div>
        <nav>
            <ul>
                <li><a href="#">Discover</a></li>
                <li><a href="#">Collections</a></li>
                <li><a href="#">Create</a></li>
                <li><a href="#">Portfolio</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="window.open('https://app.uniswap.org/swap?outputCurrency=0x22af33fe49fd1fa80c7149773dde5890d3c76f3b&chain=base', '_blank')">Buy $ISEA</button>
            <button class="btn btn-primary" id="connect-btn">Connect Wallet</button>
        </div>
    </header>

    <main class="section-container">
        <section class="hero">
            <h1>Autonomous Agents<br>Minting the Future</h1>
            <p>The premier algorithmic marketplace on Base. Experience the deep-sea liquidity of the agentic swarm.</p>
        </section>

        <section id="reef-collection">
            <div class="section-header">
                <h2>The Algorithmic Reef</h2>
            </div>
            <div class="grid" id="reef-grid"></div>
        </section>

        <section>
            <div class="section-header">
                <h2>Swarm Status Dashboard</h2>
            </div>
            <div class="swarm-dashboard" id="swarm-dashboard"></div>
        </section>
    </main>

    <script type="module">
        const { connect, disconnect, watchAccount, injected } = window.wagmiActions;
        const config = window.wagmiConfig;

        const connectBtn = document.getElementById('connect-btn');
        
        watchAccount(config, {
            onChange(account) {
                if (account.isConnected) {
                    connectBtn.innerText = `${account.address.slice(0, 6)}...${account.address.slice(-4)}`;
                    connectBtn.onclick = () => disconnect(config);
                } else {
                    connectBtn.innerText = 'Connect Wallet';
                    connectBtn.onclick = () => connect(config, { connector: injected() });
                }
            }
        });

        // Initial state
        connectBtn.onclick = () => connect(config, { connector: injected() });

        async function fetchLiveData() {
            try {
                const [statsRes, treasuryRes] = await Promise.all([
                    fetch('/api/opensea-stats'),
                    fetch('/api/treasury')
                ]);
                
                const stats = await statsRes.json();
                const treasury = await treasuryRes.json();

                document.getElementById('isea-price').innerText = `$ISEA: $0.00049 | Floor: ${stats.floor_price} ${stats.floor_price_symbol}`;
                
                renderSwarm(treasury);
            } catch (e) {
                console.error('Live data fetch failed', e);
            }
        }

        function renderSwarm(treasury) {
            const swarmDash = document.getElementById('swarm-dashboard');
            const agents = [
                { name: 'Creator', status: 'Active', task: 'Minting Genesis Artifacts', color: '#10b981' },
                { name: 'Marketplace', status: 'Active', task: `Volume: ${treasury.recent_fees}`, color: '#3b82f6' },
                { name: 'Liquidation', status: 'Standby', task: 'Monitoring Gas Spikes', color: '#94a3b8' },
                { name: 'Treasury', status: 'Active', task: `Balance: ${treasury.eth_balance} ETH`, color: '#06b6d4' }
            ];

            swarmDash.innerHTML = agents.map(agent => `
                <div class="agent-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <span style="font-weight: 800;">${agent.name} Agent</span>
                        <span style="color: ${agent.color}; font-size: 0.7rem; font-weight: 900;">${agent.status}</span>
                    </div>
                    <div style="font-family: 'JetBrains Mono'; font-size: 0.85rem; color: var(--text-secondary);">${agent.task}</div>
                </div>
            `).join('');
        }

        const reefItems = [
            { id: 1, name: 'Silicon Anemone', utility: '1% Discovery Scan speed' },
            { id: 2, name: 'Binary Coral', utility: '0.5% Slippage reduction' },
            { id: 3, name: 'Latency Jellyfish', utility: 'Gas-free metadata updates' },
            { id: 4, name: 'Hash-Rate Urchin', utility: 'Priority access to drops' }
        ];

        function renderReef() {
            const reefGrid = document.getElementById('reef-grid');
            reefGrid.innerHTML = reefItems.map(item => `
                <div class="card">
                    <div class="card-img">
                        <img src="https://via.placeholder.com/600/1e293b/10b981?text=${item.name}" alt="${item.name}">
                    </div>
                    <div class="card-content">
                        <div class="card-name">${item.name}</div>
                        <div class="card-utility">${item.utility}</div>
                        <button class="btn btn-primary w-full justify-center" onclick="alert('Minting ${item.name} on Base...')">Mint Now</button>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => {
            renderReef();
            fetchLiveData();
            setTimeout(() => {
                document.getElementById('loading-overlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 800);
            }, 1000);
        };
    </script>
</body>
</html>
